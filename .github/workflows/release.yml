name: release

on:
    release:
        types: [published]

permissions:
    contents: write

jobs:
    release:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: Setup Node.js
              uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version: 24

            # The release tag (without a leading "v") must match the `Version:` header in
            # style.css, and the zip is named "{repo}.{version}.zip", e.g. prismatic.0.2.1.zip.
            - name: Resolve version
              id: version
              run: |
                  TAG="${{ github.event.release.tag_name }}"
                  VERSION="${TAG#v}"
                  THEME_VERSION=$(sed -n 's/^[ *]*Version:[[:space:]]*\([^[:space:]]*\).*/\1/p' style.css | head -n 1)

                  if [ "$VERSION" != "$THEME_VERSION" ]; then
                      echo "::error::Release tag ($TAG) does not match the style.css version ($THEME_VERSION)."
                      exit 1
                  fi

                  echo "zip=${{ github.event.repository.name }}.$VERSION.zip" >> "$GITHUB_OUTPUT"

            - name: Install Composer dependencies
              run: composer install --no-dev --no-interaction --prefer-dist

            # Install exactly what package-lock.json pins.
            - name: Install Node dependencies
              run: npm ci --no-fund

            # Don't publish a release built with build tools that have a known high or critical
            # vulnerability.
            - name: Audit Node dependencies
              run: npm audit --audit-level=high

            # Builds the assets with Vite, then exports the theme into the `prismatic` folder.
            - name: Build
              run: npm run build

            - name: Create ZIP
              run: zip -r "${{ steps.version.outputs.zip }}" "${{ github.event.repository.name }}"

            - name: Upload ZIP to GitHub Release
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  gh release upload "${{ github.event.release.tag_name }}" \
                    "${{ steps.version.outputs.zip }}" \
                    --clobber
